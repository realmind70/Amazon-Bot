name: Amazon Telegram Bot

on:
  schedule:
    - cron: '0 */6 * * *' # این یعنی هر ۶ ساعت یک‌بار اجرا شود
  workflow_dispatch: # این اجازه می‌دهد خودتان دستی هم دکمه اجرا را بزنید

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v3

      - name: نصب پایتون
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: نصب کتابخانه‌های مورد نیاز
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot requests beautifulsoup4

      - name: اجرای ربات اصلی
        run: python main_bot.py

      - name: ذخیره دیتابیس برای جلوگیری از ارسال تکراری
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add amazon_deals.db
          git commit -m "Update database" || echo "تغییری در دیتابیس نبود"
          git push
